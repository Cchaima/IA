# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - Texelai

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: textilegarage.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_86A965DD534548B698400760C3E00836 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_2440D9E015164AA1AC431DE4D3562D09 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: textilegarage.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_86A965DD534548B698400760C3E00836 }}/textilegarage/ia-textile:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_028062604958455AB15A86096FBC5730 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_722BDE1C6D5C4657BE68BCABA5BB8535 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E00FA5D8E2034016AB42D489E40D65BE }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'Texelai'
          slot-name: 'Production'
          images: 'textilegarage.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_86A965DD534548B698400760C3E00836 }}/textilegarage/ia-textile:${{ github.sha }}'
          