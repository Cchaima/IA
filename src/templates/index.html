<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test IA Textile</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 40px; background-color: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        h1 { color: #0078d4; }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #0078d4; color: white; padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #005a9e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧵 IA Textile</h1>
        <p>Upload une image pour tester le modèle.</p>
        
        <form action="/predict" method="post" enctype="multipart/form-data">
            <input type="file" name="image" accept="image/*" required>
            <br>
            <button type="submit">🔍 Analyser le tissu</button>
        </form>
    </div>
</body>
</html>
