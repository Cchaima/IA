services:
  mon-service-api:
    image: ia-textile
    build: .
    container_name: le_conteneur_texelai
    ports:
      - "5000:80"
    environment:
      - WEBSITES_PORT=80
      - FLASK_ENV=development
    volumes:
      - ./src/runs:/app/src/runs 
      - ./model:/app/models  <-- CORRIGÉ ICI
    restart: always